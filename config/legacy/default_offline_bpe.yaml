title: DFMTTS-ALC-PTBR-(Dist-${source_dist_type})-(MaskType-${datasets.mask_type})-(PadType-${datasets.audio_pad_type})-(Steps-${trainer.max_steps})-(bs-${train.batch_size})-(LR-${optimizer.params.learning_rate})-(wd-${optimizer.params.weight_decay})
wandb_project_name: "DFM-TTS"
wandb_entity: "alefiury"

# source_dist_type: "uniform"
source_dist_type: "mask"

datasets:
    type: "offline"

    train_metadata: "/raid/aluno_alef/DATASETS/dataset_alc_48k_md5/dfm_train_metadata.csv"
    val_metadata: "/raid/aluno_alef/DATASETS/dataset_alc_48k_md5/dfm_val_metadata.csv"
    base_dir: "/raid/aluno_alef/DATASETS/dataset_alc_48k_md5_xcodec2"

    sampling_rate: 16000
    max_audio_duration: 41

    vocab_file: "/raid/aluno_alef/DFM-TTS-2/config/vocab.json"
    audio_codec: "HKUSTAudio/xcodec2"
    speech_processor: "facebook/w2v-bert-2.0"
    max_audio_length: 2048 # Aprox. 41 seconds of audio (50 tokens/second)

    n: 1

    text_vocab_size: 6681
    audio_vocab_size: 65536

    text_pad_token: 0

    audio_mask_token: 65536
    audio_pad_token: 65537

    mask_prob: [0.7, 1.0]

    use_mask: true
    mask_type: "contiguous"
    audio_pad_type: "variable"

    # ref_drop_prob: 0.3
    # cond_drop_prob: 0.2

    ref_drop_prob: 0.0
    cond_drop_prob: 0.0
    assert_drop_prob: true

    guidance_scale: 5.0

model:
    audio_vocab_size: ${datasets.audio_vocab_size}
    text_vocab_size: ${datasets.text_vocab_size}
    hidden_size: 768
    cond_dim: 128
    n_heads: 12
    n_blocks: 12
    dropout: 0.1
    add_token: 2

train:
    batch_size: 100
    shuffle: True
    num_workers: 12

optimizer:
    name: "adamw"
    params:
        min_learning_rate: 1e-4
        learning_rate: 3e-4
        eps: 1e-8
        weight_decay: 1e-4
        betas: [0.9, 0.999]

scheduler:
    name: "CosineWarmupLR"
    params:
        warmup_lr: 5000

trainer:
    accelerator: "gpu"
    # max_epochs: 100
    # max_steps: 500000
    max_steps: 1000000
    num_sanity_val_steps: 2
    overfit_batches: 0.0
    log_every_n_steps: 10
    gradient_clip_val: 10.0
    gradient_clip_algorithm: "norm"
    val_check_interval: 1.0 # Every 1 epoch
    accumulate_grad_batches: 1

model_checkpoint:
    mode: "min"
    save_last: true
    save_weights_only: false
    monitor: "val/loss_epoch"
    dirpath: "/hadatasets/alef.ferreira/DFM-TTS-2/checkpoints/DFMTTS"
    filename: "{epoch:02d}-{step:02d}-{val/loss_epoch:.3f}"

test:
    log_audio_ref: true
    nsf: 512
    max_audio_length: 1024
    audio_ref_path: "/raid/aluno_alef/DATASETS/dataset_alc_48k_md5/bbd699/100/a600e123eb.wav"
    text_ref: "O que ela disse? E como é que ela sabia que nós estávamos lá, afinal?"
    sentences:
        - "Embora estivesse chovendo, eles decidiram passear na floresta."
        - "Por causa do trânsito intenso, chegamos à reunião um pouco atrasados."
        - "Se você quer ter sucesso, deve estar preparado para trabalhar muito duro e manter o foco."
        - "Antes de sair de férias, lembre-se de regar as plantas e trancar todas as portas."
        - "Depois de terminar o trabalho, ele relaxou ouvindo música clássica e lendo um livro."

tags:
    - Discrete Flow Matching
    - Xcodec2
    - PT-BR
    # - ${trainer.max_epochs}-max_epochs
    - ${trainer.max_steps}-max_steps
    - ${train.batch_size}-BS
    - LR-${optimizer.params.learning_rate}