title: DFMTTS-(Epochs-${trainer.max_epochs})-(bs-${train.batch_size})-(LR-${optimizer.params.learning_rate})-(wd-${optimizer.params.weight_decay})
wandb_project_name: "DFM-TTS"
wandb_entity: "alefiury"

datasets:
    train_metadata: "/hadatasets/alef.ferreira/DATASETS/LJSpeech-1.1/train_metadata.csv"
    val_metadata: "/hadatasets/alef.ferreira/DATASETS/LJSpeech-1.1/val_metadata.csv"
    base_dir: "/hadatasets/alef.ferreira/DATASETS/LJSpeech-1.1/wavs"

    sampling_rate: 16000
    max_audio_duration: 41

    vocab_file: "../config/vocab.json"
    audio_codec: "HKUSTAudio/xcodec2"
    speech_processor: "facebook/w2v-bert-2.0"
    max_length: 2048 # Aprox. 41 seconds of audio (50 tokens/second)

    n: 1

    text_vocab_size: 6681
    audio_vocab_size: 65536

    mask_token: 65536
    pad_token: 65537

model:
    audio_vocab_size: ${datasets.audio_vocab_size}
    text_vocab_size: ${datasets.text_vocab_size}
    hidden_size: 768
    cond_dim: 128
    n_heads: 12
    n_blocks: 12
    dropout: 0.1
    add_token: 2

train:
    batch_size: 8
    shuffle: True
    num_workers: 12

optimizer:
    name: "adamw"
    params:
        min_learning_rate: 1e-5
        learning_rate: 5e-5
        eps: 1e-8
        weight_decay: 1e-4
        betas: [0.9, 0.999]

scheduler:
    name: "CosineWarmupLR"
    params:
        warmup_lr: 2500

tags:
    - Discrete Flow Matching
    - LJSpeech
    - ${trainer.max_epochs}-max_epochs
    - ${train.batch_size}-BS
    - LR-${optimizer.params.learning_rate}

trainer:
    accelerator: "gpu"
    max_epochs: 1000
    num_sanity_val_steps: 2
    overfit_batches: 0.0
    log_every_n_steps: 10
    gradient_clip_val: 10.0
    gradient_clip_algorithm: "norm"
    val_check_interval: 1.0 # Every 1 epoch
    accumulate_grad_batches: 4

model_checkpoint:
    mode: "min"
    save_last: true
    save_weights_only: false
    monitor: "val/loss_epoch"
    dirpath: "../checkpoints/DFMTTS"
    filename: "{epoch:02d}-{step:02d}-{val/loss_epoch:.3f}"

test:
    log_audio_ref: false
    sentences:
        - "killed Dallas Police Officer J. D. Tippit in an apparent attempt to escape"
        - "Now, as all books not primarily intended as picture-books consist principally of types composed to form letterpress"
        - "There is no way, however, to eliminate the possibility of the fibers having come from another identical shirt, end quote"
        - "Oswald's Marine training in marksmanship, his other rifle experience and his established familiarity with this particular weapon"
        - "Nevertheless, she attempted to commit suicide by driving her nails, purposely left long, into her throat."